<nav>
  {% for item in site.data.navigation %}
    {% if page.url == item.link %}
      <a href="{{ site.baseurl }}{{ item.link }}" class="current">{{ item.name }}</a>
    {% else %}
      <a href="{{ site.baseurl }}{{ item.link }}" class="inactive">{{ item.name }}</a>
    {% endif %}
  {% endfor %}
</nav>
